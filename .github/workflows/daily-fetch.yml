name: Daily Listing Fetch

on:
  # Run every day at 7 AM EST (12 PM UTC)
  schedule:
    - cron: '0 12 * * *'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  fetch-listings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch new listings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_HASDATA_API_KEY: ${{ secrets.VITE_HASDATA_API_KEY }}
        run: npm run fetch-listings

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily listing fetch failed! Check the logs above for details."
